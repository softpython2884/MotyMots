# Généré par deploy.sh (MotyMots). Certbot y ajoute la partie HTTPS.
map $http_upgrade $motymots_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    client_max_body_size 1k;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/ws) : les connexions restent ouvertes pendant toute la partie
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $motymots_connection;
        proxy_read_timeout 1h;
    }
}
